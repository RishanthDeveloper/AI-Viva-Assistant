# ---------- Database ----------
# Default = in-memory H2 (zero config, data re-seeded on every start).
# For real persistence set DB_URL / DB_USERNAME / DB_PASSWORD, e.g.
#   MySQL:      jdbc:mysql://localhost:3306/vivax?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
#   PostgreSQL: jdbc:postgresql://HOST:5432/DBNAME
#   Supabase (Session pooler): jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#                              DB_USERNAME = postgres.<project-ref>
spring.datasource.url=${DB_URL:jdbc:h2:mem:vivax;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Keep the pool small for Supabase pooler limits
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Must be at least 32 characters. Set JWT_SECRET in production.
jwt.secret=${JWT_SECRET:vivax-dev-only-secret-change-me-in-production-0123456789}
jwt.expiration=86400000

# ---------- CORS ----------
# Comma separated list of allowed frontend origins (origin = scheme + host, no path, no trailing slash)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000,https://rishanthdeveloper.github.io}

server.port=${PORT:8080}
